<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FLUX — Gestor de Marketing Digital</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.07);
      --accent: #ff6b35;
      --accent2: #f7c59f;
      --text: #e2e2e2;
      --muted: #888;
    }

    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    #header { padding: 14px 24px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(135deg,#ff6b35,#f7c59f); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: #0a0a0f; box-shadow: 0 4px 16px rgba(255,107,53,0.35); }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: #fff; letter-spacing: -0.5px; }
    .logo-sub { font-size: 11px; color: var(--accent); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
    .connect-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .conn-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: #bbb; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 5px; }
    .conn-btn:hover, .conn-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,0.1); }
    .conn-btn.connected { border-color: #4caf50; color: #4caf50; background: rgba(76,175,80,0.1); }

    /* Quick actions */
    #quick-actions { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 7px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
    #quick-actions::-webkit-scrollbar { display: none; }
    .qa-btn { padding: 6px 13px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: #bbb; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; transition: all .2s; flex-shrink: 0; }
    .qa-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,0.1); transform: translateY(-1px); }

    /* Messages */
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,107,53,0.2); border-radius: 4px; }

    .msg { display: flex; gap: 10px; align-items: flex-start; animation: fadeUp .3s ease; }
    .msg.user { flex-direction: row-reverse; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
    .avatar.flux { background: linear-gradient(135deg,#ff6b35,#f7c59f); color: #0a0a0f; }
    .avatar.user { background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; }

    .bubble { max-width: 72%; padding: 12px 15px; border-radius: 4px 16px 16px 16px; font-size: 13.5px; line-height: 1.72; border: 1px solid rgba(255,255,255,0.07); background: var(--surface); color: var(--text); }
    .msg.user .bubble { border-radius: 16px 4px 16px 16px; background: rgba(102,126,234,0.12); border-color: rgba(102,126,234,0.25); }
    .bubble h1,.bubble h2,.bubble h3 { font-family: 'Syne', sans-serif; margin: 10px 0 4px; }
    .bubble h1 { color: #fff; font-size: 16px; }
    .bubble h2 { color: var(--accent2); font-size: 14px; }
    .bubble h3 { color: var(--accent); font-size: 13px; }
    .bubble strong { color: var(--accent2); }
    .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }
    .bubble li { margin-bottom: 3px; }
    .bubble p { margin-bottom: 6px; }
    .bubble code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

    /* Typing */
    .typing { display: flex; gap: 5px; align-items: center; padding: 4px 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

    /* Input */
    #input-area { padding: 14px 20px 20px; background: rgba(255,255,255,0.02); border-top: 1px solid var(--border); flex-shrink: 0; }
    .input-wrap { display: flex; gap: 10px; align-items: flex-end; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 14px; padding: 4px 4px 4px 16px; transition: border-color .2s; }
    .input-wrap:focus-within { border-color: var(--accent); }
    #user-input { flex: 1; background: none; border: none; color: var(--text); font-size: 13.5px; font-family: 'DM Sans', sans-serif; resize: none; padding: 10px 0; max-height: 120px; line-height: 1.5; outline: none; }
    #user-input::placeholder { color: var(--muted); }
    #send-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: linear-gradient(135deg,#ff6b35,#f7c59f); cursor: pointer; color: #0a0a0f; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; }
    #send-btn:disabled { background: rgba(255,255,255,0.08); color: #555; cursor: default; transform: none; }
    #send-btn:not(:disabled):hover { transform: scale(1.05); opacity: .9; }
    .hint { text-align: center; color: #444; font-size: 11px; margin-top: 8px; }

    /* Status bar */
    #status-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .status-pill { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; border: 1px solid; }
    .status-pill.ok { border-color: #4caf5055; color: #4caf50; background: rgba(76,175,80,0.08); }
    .status-pill.off { border-color: #55555555; color: #666; background: transparent; }

    /* Dashboard panel */
    #dashboard { display: none; position: fixed; top: 0; right: 0; width: 360px; height: 100vh; background: #0d0d16; border-left: 1px solid var(--border); z-index: 100; overflow-y: auto; padding: 20px; }
    #dashboard.open { display: block; animation: slideIn .3s ease; }
    @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
    .panel-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: #fff; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .metric-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .metric-value { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: #fff; }
    .metric-delta { font-size: 11px; color: #4caf50; margin-top: 2px; }
    .close-panel { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="logo">
    <div class="logo-icon">F</div>
    <div>
      <div class="logo-text">FLUX</div>
      <div class="logo-sub">Marketing Digital</div>
    </div>
  </div>
  <div class="connect-buttons">
    <button class="conn-btn" id="btn-ig" onclick="connectInstagram()">📱 Instagram</button>
    <button class="conn-btn" id="btn-google" onclick="connectGoogle()">📊 Google</button>
    <button class="conn-btn" id="btn-dash" onclick="toggleDashboard()">📈 Dashboard</button>
  </div>
</div>

<!-- Quick Actions -->
<div id="quick-actions">
  <button class="qa-btn" onclick="quickSend('Crie um copy persuasivo para meu produto/serviço com headline, legenda e CTA.')">✍️ Copy</button>
  <button class="qa-btn" onclick="quickSend('Me ajude a criar uma persona detalhada e identifique o arquétipo de Jung ideal para minha marca.')">👤 Persona</button>
  <button class="qa-btn" onclick="analyzeData()">📊 Analisar dados</button>
  <button class="qa-btn" onclick="quickSend('Crie um plano de 7 dias de conteúdo para Instagram: posts feed, stories e ideias de reels.')">📅 Plano de Conteúdo</button>
  <button class="qa-btn" onclick="quickSend('Monte uma estratégia completa de funil de vendas online para meu negócio.')">🎯 Funil de Vendas</button>
  <button class="qa-btn" onclick="quickSend('Me ensine a montar uma campanha no Google Ads do zero, com estrutura de grupos, palavras-chave e extensões.')">💡 Google Ads</button>
  <button class="qa-btn" onclick="quickSend('Como gerar mais leads qualificados? Monte um plano de inbound marketing com lead magnet e nutrição.')">🧲 Leads</button>
  <button class="qa-btn" onclick="quickSend('Vamos elaborar um briefing completo para uma campanha. Me faça todas as perguntas necessárias.')">📋 Briefing</button>
  <button class="qa-btn" onclick="quickSend('Sugira 5 dinâmicas interativas para engajar minha audiência no Instagram (stories, lives, quizzes).')">🎮 Dinâmicas</button>
</div>

<!-- Messages -->
<div id="messages"></div>

<!-- Dashboard Panel -->
<div id="dashboard">
  <div class="panel-title">
    📈 Dashboard
    <button class="close-panel" onclick="toggleDashboard()">✕</button>
  </div>
  <div id="dashboard-content">
    <p style="color:#666;font-size:13px;">Conecte suas contas para ver os dados aqui.</p>
  </div>
</div>

<!-- Input -->
<div id="input-area">
  <div id="status-bar">
    <span class="status-pill off" id="pill-ig">📱 Instagram</span>
    <span class="status-pill off" id="pill-ga">📊 Analytics</span>
    <span class="status-pill off" id="pill-ads">💡 Google Ads</span>
    <span class="status-pill off" id="pill-mc">🛒 Merchant</span>
  </div>
  <div class="input-wrap">
    <textarea id="user-input" rows="1" placeholder="Pergunte sobre copy, estratégia, métricas, posts..."></textarea>
    <button id="send-btn" onclick="sendMessage()" disabled>↑</button>
  </div>
  <div class="hint">Enter para enviar · Shift+Enter nova linha</div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────
  const BACKEND = window.location.hostname === 'localhost'
    ? 'http://localhost:8000'
    : window.location.origin; // mesmo domínio se servir frontend pelo FastAPI

  let state = {
    igToken: null, igId: null, igProfile: null,
    gToken: null, gRefresh: null,
    gaPropertyId: null, gaData: null,
    adsCustomerId: null, adsData: null,
    merchantId: null, merchantData: null,
    messages: []
  };

  // ── Boot ─────────────────────────────────────────────────
  window.onload = () => {
    const params = new URLSearchParams(location.search);
    if (params.get('ig_token')) { state.igToken = params.get('ig_token'); loadInstagram(); }
    if (params.get('g_token'))  { state.gToken = params.get('g_token'); state.gRefresh = params.get('g_refresh'); loadGoogle(); }
    history.replaceState({}, '', '/');

    addMessage('assistant', `Olá! Sou o **FLUX**, seu Gestor de Marketing Digital. 🚀

Estou pronto para te ajudar com:
- Copywriting e conteúdo para Instagram
- Estratégias de vendas e funil
- Google Ads, Analytics e Merchant Center
- Persona, arquétipos e posicionamento
- Leads, inbound marketing e muito mais

Conecte suas contas no topo ou use os atalhos rápidos para começar!`);

    setupInput();
  };

  // ── Textarea auto-resize ──────────────────────────────────
  function setupInput() {
    const ta = document.getElementById('user-input');
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
      document.getElementById('send-btn').disabled = !ta.value.trim();
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  }

  // ── OAuth flows ───────────────────────────────────────────
  function connectInstagram() { window.location.href = `${BACKEND}/api/instagram/auth`; }
  function connectGoogle()    { window.location.href = `${BACKEND}/api/google/auth`; }

  // ── Load data after OAuth ─────────────────────────────────
  async function loadInstagram() {
    try {
      const r = await fetch(`${BACKEND}/api/instagram/profile?token=${state.igToken}`);
      const d = await r.json();
      state.igProfile = d.profile;
      state.igId = d.ig_account_id;
      state.igToken = d.page_token || state.igToken;
      updatePill('pill-ig', true, '📱 Instagram');
      document.getElementById('btn-ig').classList.add('connected');
      document.getElementById('btn-ig').textContent = '✅ Instagram';
      addMessage('assistant', `**Instagram conectado!** ✅\n\nPerfil carregado: **@${d.profile.username}** — ${d.profile.followers_count?.toLocaleString('pt-BR')} seguidores\n\nQuer que eu analise seu perfil e dê sugestões estratégicas?`);
    } catch(e) {
      addMessage('assistant', `Erro ao carregar Instagram: ${e.message}`);
    }
  }

  async function loadGoogle() {
    updatePill('pill-ga', true, '📊 Analytics');
    updatePill('pill-ads', true, '💡 Google Ads');
    updatePill('pill-mc', true, '🛒 Merchant');
    document.getElementById('btn-google').classList.add('connected');
    document.getElementById('btn-google').textContent = '✅ Google';
    addMessage('assistant', `**Google conectado!** ✅\n\nAnalytics, Google Ads e Merchant Center estão integrados. Use o botão **📊 Analisar dados** para ver um resumo completo ou pergunte qualquer coisa sobre suas métricas.`);
    await loadGoogleData();
  }

  async function loadGoogleData() {
    try {
      // GA4 properties
      const propsR = await fetch(`${BACKEND}/api/analytics/properties?token=${state.gToken}`);
      const props = await propsR.json();
      const accounts = props.accountSummaries || [];
      if (accounts[0]?.propertySummaries?.[0]) {
        state.gaPropertyId = accounts[0].propertySummaries[0].property.split('/')[1];
        const repR = await fetch(`${BACKEND}/api/analytics/report?token=${state.gToken}&property_id=${state.gaPropertyId}`);
        state.gaData = await repR.json();
      }
      // Ads customers
      const custR = await fetch(`${BACKEND}/api/ads/customers?token=${state.gToken}`);
      const custs = await custR.json();
      if (custs.resourceNames?.[0]) {
        state.adsCustomerId = custs.resourceNames[0].split('/')[1];
        const sumR = await fetch(`${BACKEND}/api/ads/summary?token=${state.gToken}&customer_id=${state.adsCustomerId}`);
        state.adsData = await sumR.json();
      }
      // Merchant
      const merR = await fetch(`${BACKEND}/api/merchant/accounts?token=${state.gToken}`);
      const mers = await merR.json();
      if (mers.accountIdentifiers?.[0]) {
        state.merchantId = mers.accountIdentifiers[0].merchantId;
        const prodR = await fetch(`${BACKEND}/api/merchant/product-statuses?token=${state.gToken}&merchant_id=${state.merchantId}`);
        state.merchantData = await prodR.json();
      }
      renderDashboard();
    } catch(e) { console.warn('Google data load error', e); }
  }

  // ── Dashboard ─────────────────────────────────────────────
  function toggleDashboard() {
    document.getElementById('dashboard').classList.toggle('open');
  }

  function renderDashboard() {
    const el = document.getElementById('dashboard-content');
    let html = '';

    if (state.igProfile) {
      html += `<div style="font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Instagram</div>`;
      html += card('Seguidores', state.igProfile.followers_count?.toLocaleString('pt-BR') || '–', '');
      html += card('Posts', state.igProfile.media_count || '–', '');
    }
    if (state.gaData?.rows) {
      const totals = state.gaData.totals?.[0]?.metricValues || [];
      html += `<div style="font-size:12px;color:#4285f4;font-weight:600;margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px">Google Analytics (30d)</div>`;
      html += card('Sessões', parseInt(totals[0]?.value||0).toLocaleString('pt-BR'), '');
      html += card('Usuários Ativos', parseInt(totals[1]?.value||0).toLocaleString('pt-BR'), '');
    }
    if (state.adsData) {
      html += `<div style="font-size:12px;color:#fbbc04;font-weight:600;margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px">Google Ads (30d)</div>`;
    }
    if (state.merchantData?.summary) {
      const s = state.merchantData.summary;
      html += `<div style="font-size:12px;color:#34a853;font-weight:600;margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px">Merchant Center</div>`;
      html += card('Produtos Aprovados', s.approved, '');
      html += card('Produtos Reprovados', s.disapproved, '');
    }
    el.innerHTML = html || '<p style="color:#666;font-size:13px">Nenhum dado disponível ainda.</p>';
  }

  function card(label, value, delta) {
    return `<div class="metric-card"><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${delta ? `<div class="metric-delta">${delta}</div>` : ''}</div>`;
  }

  // ── Chat ──────────────────────────────────────────────────
  async function sendMessage(overrideText) {
    const ta = document.getElementById('user-input');
    const text = overrideText || ta.value.trim();
    if (!text) return;

    ta.value = '';
    ta.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    addMessage('user', text);
    state.messages.push({ role: 'user', content: text });

    const typingId = addTyping();

    try {
      const context = {};
      if (state.igProfile) context.instagram = JSON.stringify(state.igProfile);
      if (state.gaData) context.analytics = JSON.stringify(state.gaData);
      if (state.adsData) context.ads = JSON.stringify(state.adsData);
      if (state.merchantData) context.merchant = JSON.stringify(state.merchantData);

      const r = await fetch(`${BACKEND}/api/chat/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: state.messages, context })
      });
      const d = await r.json();
      const reply = d.reply || 'Erro ao obter resposta.';
      removeTyping(typingId);
      addMessage('assistant', reply);
      state.messages.push({ role: 'assistant', content: reply });
    } catch(e) {
      removeTyping(typingId);
      addMessage('assistant', `Erro de conexão com o servidor. Verifique se o backend está rodando.`);
    }
  }

  function quickSend(text) { sendMessage(text); }
  function analyzeData() {
    const parts = [];
    if (state.igProfile) parts.push('Instagram');
    if (state.gaData) parts.push('Google Analytics');
    if (state.adsData) parts.push('Google Ads');
    if (state.merchantData) parts.push('Merchant Center');
    const src = parts.length ? parts.join(', ') : 'meu negócio';
    quickSend(`Analise todos os dados disponíveis de ${src} e me dê um relatório estratégico com os principais insights e 3 ações prioritárias.`);
  }

  // ── UI Helpers ─────────────────────────────────────────────
  function addMessage(role, text) {
    const el = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar ${role === 'assistant' ? 'flux' : 'user'}">${role === 'assistant' ? 'F' : 'V'}</div>
      <div class="bubble">${renderMarkdown(text)}</div>
    `;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    return div;
  }

  function addTyping() {
    const id = 'typing-' + Date.now();
    const el = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.id = id;
    div.innerHTML = `<div class="avatar flux">F</div><div class="bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    document.getElementById(id)?.remove();
  }

  function updatePill(id, on, label) {
    const el = document.getElementById(id);
    el.className = `status-pill ${on ? 'ok' : 'off'}`;
    el.textContent = label;
  }

  function renderMarkdown(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/^### (.+)$/gm,'<h3>$1</h3>')
      .replace(/^## (.+)$/gm,'<h2>$1</h2>')
      .replace(/^# (.+)$/gm,'<h1>$1</h1>')
      .replace(/^- (.+)$/gm,'<li>$1</li>')
      .replace(/`(.+?)`/g,'<code>$1</code>')
      .replace(/\n\n/g,'<br><br>')
      .replace(/\n/g,'<br>');
  }
</script>
</body>
</html>
